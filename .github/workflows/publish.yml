name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify packaged UI assets
        shell: bash
        run: |
          test -d src/ui/dist
          find src/ui/dist -mindepth 2 -maxdepth 2 -name index.html -print -quit | grep -q .
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r '.version' deno.json)"
      - name: Quality gates
        run: |
          deno task fmt:check
          deno task check
          deno task lint
          deno task test
      - name: Publish package
        run: deno publish
