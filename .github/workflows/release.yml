name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Rebuild UI assets
        working-directory: src/ui
        run: |
          npm ci
          npm run build
      - name: Verify packaged UI assets
        shell: bash
        run: |
          test -d src/ui/dist
          deno task verify:ui
          test -z "$(find src/ui/dist -mindepth 2 -maxdepth 2 -name index.html -print -quit)"
          test -z "$(git status --porcelain -- src/ui/dist)"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r '.version' deno.json)"
      - name: Quality gates
        run: |
          deno task fmt:check
          deno task check
          deno task lint
          deno task test

  publish:
    name: Publish JSR package
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Publish package
        run: deno publish

  build:
    name: Build ${{ matrix.target }}
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mcp-std-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mcp-std-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mcp-std-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mcp-std-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mcp-std-windows-x64.exe

    steps:
      - uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile
        shell: bash
        run: |
          deno compile -A \
            --include src/ui/dist \
            --target ${{ matrix.target }} \
            --output ${{ matrix.artifact }} \
            server.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in dist/*/; do
            for file in "$dir"*; do
              if [ -f "$file" ]; then
                mv "$file" release/
              fi
            done
          done
          ls -la release/

      - name: Create checksums
        working-directory: release
        run: |
          sha256sum mcp-std-* > checksums.sha256
          cat checksums.sha256

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: MCP Std ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            release/mcp-std-linux-x64
            release/mcp-std-linux-arm64
            release/mcp-std-darwin-x64
            release/mcp-std-darwin-arm64
            release/mcp-std-windows-x64.exe
            release/checksums.sha256
          body: |
            ## MCP Std Server ${{ steps.version.outputs.version }}

            Pre-compiled MCP server with the release's tool catalogue and
            packaged MCP Apps viewer assets.

            ### Download

            | Platform | Binary |
            |----------|--------|
            | Linux x64 | `mcp-std-linux-x64` |
            | Linux ARM64 | `mcp-std-linux-arm64` |
            | macOS Intel | `mcp-std-darwin-x64` |
            | macOS Apple Silicon | `mcp-std-darwin-arm64` |
            | Windows | `mcp-std-windows-x64.exe` |

            ### Usage

            Add to your `mcp-servers.json`:
            ```json
            {
              "mcpServers": {
                "std": {
                  "command": "/path/to/mcp-std-linux-x64"
                }
              }
            }
            ```

            Or with Deno:
            ```json
            {
              "mcpServers": {
                "std": {
                  "command": "deno",
                  "args": ["run", "-A", "jsr:@casys/mcp-std/server"]
                }
              }
            }
            ```

            ### Verify Checksums
            ```bash
            sha256sum -c checksums.sha256
            ```
